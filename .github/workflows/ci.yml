name: CI

on: 
  pull_request:
  push:
    branches:
      - japanese

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Build
      uses: docker/setup-buildx-action@v2

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        file: ./docker/Dockerfile
        platforms: linux/amd64
        push: ${{ github.ref == 'refs/heads/japanese' }}
        load: ${{ github.ref != 'refs/heads/japanese' }}
        tags: ghcr.io/ymotongpoo/erlang-in-anger-pdf:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: PDF build
      run: |
        sudo chown -R root:root $GITHUB_WORKSPACE
        docker-compose up --abort-on-container-exit

    - name: Push Docker image
      run: docker-compose push
      if: ${{ github.ref == 'refs/heads/japanese' }}

    - name: Push PDF file
      uses: actions/upload-artifact@v2
      with:
        name: erlang in anger
        path: text-ja.pdf

  release:
    name: Publish artifact to gh-pages
    if: github.ref == 'refs/heads/japanese'
    needs: build
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v2

      - name: Download PDF
        uses: actions/download-artifact@v2
        with:
          name: erlang in anger
          path: ./build/

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@4.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: build
          target-folder: ./
          clean: true

